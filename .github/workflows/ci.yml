name: CI

# Runs on every push and PR so problems show up as a red X on GitHub
# itself — the only reliable way to debug this app without a working
# local `npm install`/`npm run build` (Prisma doesn't run on Termux/
# Android, see README). This workflow never touches the real database:
# it uses a fake DATABASE_URL/DIRECT_URL just so `prisma generate` has
# something to point at, and calls `build:ci` (plain `next build`), not
# `build` (which runs `prisma db push` against the real Supabase
# instance — that stays exclusive to Vercel's actual deploy, which has
# the real secrets).
#
# Deliberately uses `npm install`, not `npm ci`, and no npm cache: both
# require a committed package-lock.json, and generating an accurate one
# needs a real `npm install` against the npm registry — something
# neither this project's dev environment nor Termux (no network) can
# do. `npm install` works fine without a lock file; it's just a little
# slower with no cache. Worth revisiting once a lock file exists.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://user:password@localhost:5432/naze_ci"
      DIRECT_URL: "postgresql://user:password@localhost:5432/naze_ci"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build:ci
